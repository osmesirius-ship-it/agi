<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oracle Chat UI</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f3f5f7; }
    .wrap { max-width: 800px; margin: 30px auto; background: white; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    .header { padding: 16px 20px; border-bottom: 1px solid #eee; font-weight: 700; }
    .chat { padding: 16px 20px; height: 420px; overflow-y: auto; }
    .msg { margin: 10px 0; padding: 10px 12px; border-radius: 8px; max-width: 90%; white-space: pre-wrap; }
    .user { background: #dceeff; margin-left: auto; }
    .bot { background: #f1f1f1; }
    form { display: flex; gap: 8px; padding: 16px 20px; border-top: 1px solid #eee; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    button { padding: 10px 16px; border: none; border-radius: 8px; background: #165dff; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">Oracle Simulation Chat</div>
    <div id="chat" class="chat"></div>
    <form id="form">
      <input id="input" placeholder="Ask about diffusion, energy, or mass" />
      <button type="submit">Send</button>
    </form>
  </div>
  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');

    const push = (text, cls) => {
      const div = document.createElement('div');
      div.className = `msg ${cls}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    };

    push('Hello! I am Oracle. Try asking: "how is diffusion configured?"', 'bot');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      push(message, 'user');
      input.value = '';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, steps: 200, dt: 1e-4, diffusion: 'explicit' })
        });
        const data = await res.json();
        push(data.response + `\n(rho_sum=${data.rho_sum}, R_energy=${data.R_energy})`, 'bot');
      } catch (err) {
        push('Request failed: ' + err.message, 'bot');
      }
    });
  </script>
</body>
</html>
